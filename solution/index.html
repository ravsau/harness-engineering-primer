<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Post Checker — check your posts</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 12px; }
  h1 { margin-bottom: 0; }
  .tagline { color: #666; margin-top: 4px; }
  textarea { width: 100%; height: 150px; font-size: 16px; padding: 8px; box-sizing: border-box; }
  #count { font-weight: bold; margin: 8px 0; }
  .over-limit { color: red; }
  mark { background: yellow; }
  #preview { white-space: pre-wrap; border: 1px solid #ccc; padding: 8px; min-height: 40px; margin-top: 8px; }
  .legend { font-size: 13px; color: #888; }
</style>
</head>
<body>
<h1>Post Checker</h1>
<p class="tagline">A game-changer for your X posts — paste, check, post.</p>
<textarea id="post" placeholder="Paste your post here — we'll check it"></textarea>
<div id="count">0 / 280</div>
<div id="flags"></div>
<div id="preview"></div>
<p class="legend" id="legend"></p>

<script src="checker.js"></script>
<script>
  var box = document.getElementById("post");

  function update() {
    var text = box.value;

    var n = countX(text);
    var countEl = document.getElementById("count");
    countEl.innerHTML = n + " / " + LIMIT;
    countEl.className = n > LIMIT ? "over-limit" : "";

    var flags = findBanned(text);
    var names = [];
    for (var i = 0; i < flags.length; i++) names.push(flags[i].word);
    document.getElementById("flags").innerHTML = flags.length ? "Flagged: " + names.join(", ") : "Looks good!";

    // preview with the flagged words highlighted
    var html = "";
    var pos = 0;
    for (var j = 0; j < flags.length; j++) {
      var start = flags[j].index;
      var end = start + flags[j].word.length;
      html += text.substring(pos, start) + "<mark>" + text.substring(start, end) + "</mark>";
      pos = end;
    }
    html += text.substring(pos);
    document.getElementById("preview").innerHTML = html;
  }

  document.getElementById("legend").innerHTML = "We flag: " + BANNED.join(", ");
  box.addEventListener("input", update);

  // index.html?text=... opens with a draft filled in
  var m = location.search.match(/[?&]text=([^&]*)/);
  if (m) box.value = decodeURIComponent(m[1]);
  update();
</script>
</body>
</html>
